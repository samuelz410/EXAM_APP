<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Background circle (Light Purple) -->
  <circle cx="50" cy="50" r="50" fill="#f3e8ff" />
  
  <!-- Document shape (White with Dark Purple border) -->
  <rect x="25" y="15" width="50" height="70" rx="5" fill="#ffffff" stroke="#4c1d95" stroke-width="4" />
  
  <!-- Lines on document (Lighter Purple) -->
  <line x1="35" y1="35" x2="65" y2="35" stroke="#ddd6fe" stroke-width="4" />
  <line x1="35" y1="50" x2="65" y2="50" stroke="#ddd6fe" stroke-width="4" />
  <line x1="35" y1="65" x2="50" y2="65" stroke="#ddd6fe" stroke-width="4" />
  
  <!-- Checkmark (Dark Purple) -->
  <polyline points="30 55 45 70 70 30" fill="none" stroke="#4c1d95" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
</svg>